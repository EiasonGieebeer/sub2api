name: Deploy Sub2API Docs

on:
  push:
    branches: [my-custom]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sub2api-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - name: Package documentation
        run: tar -C docs-site/.vitepress -czf sub2api-docs.tar.gz dist
      - name: Copy documentation to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: sub2api-docs.tar.gz
          target: /tmp/
      - name: Publish documentation on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            archive=/tmp/sub2api-docs.tar.gz
            staging=$(mktemp -d)
            trap 'rm -rf "$staging" "$archive"' EXIT
            tar -xzf "$archive" -C "$staging"
            test -f "$staging/dist/index.html"
            mkdir -p /var/www/sub2api-docs
            rsync -a --delete "$staging/dist/" /var/www/sub2api-docs/
